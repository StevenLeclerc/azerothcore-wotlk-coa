-- =====================================================================================
-- mod-ascension-compat — PATRON « MODIFICATEUR DE SORT » : prototype sur TROIS talents.
--
-- NE PAS APPLIQUER TEL QUEL. Ce fichier est un prototype de conception, écrit le
-- 2026-09-20 en lecture seule. Aucune de ses lignes n'a été exécutée, ni en base de
-- test, ni ailleurs. Il accompagne docs/CONCEPTION-patron-modificateurs.md, qui porte
-- la mesure complète, l'arbitrage donnée-contre-C++ et la marche à suivre.
--
-- POURQUOI L'EXTENSION EST `.sql.proto` ET NON `.sql` — corrigé le 2026-09-20 après
-- relecture adverse. Tant qu'il portait `.sql`, ce fichier était posé dans le répertoire
-- que `coa-project/exploitation/appliquer-sql-module.sh` applique EN BLOC : sa boucle est
-- `for f in "$SQLDIR"/*.sql`, elle ne saute que les fichiers déjà inscrits dans `updates`,
-- et son unique garde-fou est que les ScriptName 'aura_ascension_*' / 'spell_ascension_*'
-- insérés existent dans le binaire. Ce fichier n'en insère AUCUN (0 occurrence du motif) :
-- il aurait donc été classé « PRET (aucun script nomme) », appliqué par
-- `sudo mysql acore_world < "$f"`, inscrit dans `updates`, puis suivi d'un redémarrage de
-- `coa-world-bots` — et c'est le redémarrage, précisément, qui rend `spell_dbc` effectif.
-- Mesuré le 2026-09-20 : `SELECT COUNT(*) FROM updates WHERE name LIKE '2026_09_20_1%'`
-- vaut 0, donc les fichiers 08 à 17 étaient tous en attente et seraient partis ensemble au
-- prochain `--appliquer`. Or le débordement sur les trois autres « Gaze » (bloc 1) et le
-- sort du bit w0.b15 (bloc 2) demandent un arbitrage humain AVANT toute application.
-- (Le chargeur automatique d'AzerothCore, UpdateFetcher.cpp, balaye le même répertoire ;
-- il est neutralisé ici par `Updates.EnableDatabases = 0` dans worldserver.conf — c'est le
-- script d'exploitation, pas le cœur, qui constituait le risque.)
-- POUR L'ARMER, une fois l'arbitrage rendu : renommer en `.sql`. Rien d'autre à changer.
--
-- -------------------------------------------------------------------------------------
-- CE QUE FAIT LE LEVIER `spell_dbc`, ET CE QU'IL COÛTE — lu dans le cœur, pas supposé
--
--   src/server/shared/DataStores/DBCDatabaseLoader.cpp, DBCDatabaseLoader::Load :
--     * la requête est `SELECT * FROM spell_dbc ORDER BY ID DESC` ; il n'y a AUCUNE
--       fusion avec le fichier : la ligne SQL REMPLACE l'entrée du DBC en entier
--       (commentaire du cœur : « If exist in DBC file override from DB ») ;
--     * la boucle parcourt les 234 caractères de SpellEntryfmt (DBCfmt.h) et avance
--       d'une colonne SQL à CHAQUE caractère, y compris les 'x' ignorés, puis
--       `ASSERT(sqlColumnNumber == result->GetFieldCount())`. La table doit donc avoir
--       EXACTEMENT 234 colonnes, dans l'ordre du format — vérifié : elle les a, et le
--       type de chacune concorde avec son caractère de format (contrôle mécanique) ;
--     * une colonne omise dans l'INSERT prend son DEFAULT (0) et ÉCRASE la valeur du
--       fichier DBC. D'où les lignes complètes ci-dessous : il n'y a pas d'INSERT partiel ;
--     * seule exception, FT_STRING : « not override string if new string is empty ».
--       Les 32 vraies colonnes de chaînes (Name_Lang_*, NameSubtext_Lang_*) sont donc
--       écrites à '' et le cœur conserve le pointeur du fichier DBC. Les 32 autres
--       colonnes textuelles (Description_Lang_*, AuraDescription_Lang_*) sont des 'x' :
--       le serveur ne les lit pas du tout, elles sont écrites à '' aussi — y recopier
--       l'entier du DBC n'aurait aucun sens, c'est un décalage dans le bloc de chaînes.
--       L'infobulle que voit le joueur vient du Spell.dbc du CLIENT : ce fichier ne la
--       change pas, et aucune réparation par la donnée ne peut corriger un texte ;
--     * les valeurs négatives passent : Field::GetData<uint32> (Field.cpp) a un cas
--       spécial pour les tables dont le nom finit par `_dbc` et retourne alors l'int32.
--       Vérifié aussi en pratique : les 119 lignes en service portent déjà des négatifs
--       (EquippedItemClass = -1, EffectBasePoints_2 = -276) ;
--     * la table N'EST LUE QU'AU DÉMARRAGE. Il n'existe pas de `.reload spell_dbc` :
--       contrairement à `spell_proc`, il faut redémarrer le worldserver.
--
--   CE QUE CE LEVIER COÛTE FACE À L'AMONT — P-047, ajouté après relecture adverse.
--   Une ligne `spell_dbc` recopie 234 colonnes : elle FIGE le sort ENTIER à l'instantané
--   du 2026-09-20. L'import du DBC client du 2026-09-19 a désarmé des contrats du module
--   en silence (P-047) : c'est une mise à jour de CONTENU amont, elle recommencera. Après
--   un tel import, les 233 colonnes que cette ligne ne voulait pas changer continueront
--   d'écraser le fichier avec les valeurs d'hier, sans le moindre signal. Le fichier frère
--   2026_09_20_15_ascension_runemasterfrigid.sql conclut d'ailleurs l'inverse pour la même
--   raison (« elle figerait le sort contre le prochain import de DBC client (P-047) »).
--   Quand le seul champ à changer est un EffectAura ou un mot de masque — c'est le cas des
--   TROIS blocs ci-dessous — un patch C++ dans le crochet `OnLoadSpellCustomAttr`
--   (GlobalScript, GLOBALHOOK_ON_LOAD_SPELL_CUSTOM_ATTR ; le module en fait déjà, cf.
--   AscensionBarbarianCompletion.cpp:68 `info->Effects[EFFECT_0].ApplyAuraName =
--   SPELL_AURA_ADD_PCT_MODIFIER`) ne gèle QU'UN champ et survit à l'import. Ce fichier
--   reste un prototype du levier `spell_dbc` ; il ne prétend plus être la bonne voie.
--
--   Coût réel d'une ligne : 234 colonnes recopiées à l'identique pour n'en changer une.
--   Une seule erreur de recopie modifie le sort en silence. Les lignes ci-dessous ont
--   été produites par un générateur qui relit Spell.dbc et se contrôle lui-même
--   (coa-project/outils/gen-ligne-spell-dbc.py : il compare champ à champ ce qu'il écrit à ce
--   qu'il a lu, et lève une assertion à la moindre divergence).
--
-- -------------------------------------------------------------------------------------
-- LE PIÈGE À CONNAÎTRE AVANT DE POSER UN MASQUE
--
--   SpellInfo::IsAffected (SpellInfo.cpp:1422) :
--       if (!familyName)                       return true;
--       if (familyName != SpellFamilyName)     return false;
--       if (familyFlags && !(familyFlags & SpellFamilyFlags)) return false;
--       return true;
--
--   La troisième ligne ne s'exécute QUE si familyFlags est non nul. Un modificateur
--   porté par un sort de famille non nulle et dont l'EffectSpellClassMask est VIDE
--   n'est donc pas un modificateur qui rate sa cible : c'est un modificateur qui touche
--   TOUTE LA CLASSE. Ce n'est pas une hypothèse — il y a 12 cas vivants dans le DBC en
--   service (§ 4 du document de conception), dont le troisième prototype ci-dessous.
--
--   Corollaire : chaque bit d'un masque doit être confronté à TOUS les sorts de la même
--   famille, parce que le cœur teste `mask & SpellFamilyFlags != 0` — un bit partagé
--   élargit le modificateur en silence. L'outil qui fait cette confrontation est
--   coa-project/outils/sonde-masque-famille.py ; sa sortie est recopiée sous chaque
--   ligne, exhaustivement.
--
--   Rappel d'index, vérifié contre des témoins et contre DBCStructure.h :
--   EffectSpellClassMask est un `std::array<flag96, 3>` aux champs 122-130, donc
--   l'effet e occupe 122+3e, 123+3e, 124+3e — et NON 123+e / 126+e / 129+e.
--   En colonnes SQL : MaskA_1/2/3 = effet 1 mots 1/2/3, MaskB_* = effet 2, MaskC_* = effet 3.
--   Vérification : Arcane Power 12042 porte son aura 108 à l'effet 3 et son seul mot de
--   masque non nul est le champ 128 (= MaskC_1). Statistique sur tout le DBC : les sorts
--   à un seul effet modificateur d'index 0 n'ont de bits qu'aux champs 122-124, ceux
--   d'index 1 qu'aux champs 125-127, ceux d'index 2 qu'aux champs 128-130.
--
-- -------------------------------------------------------------------------------------
-- LES TROIS PROTOTYPES — trois sous-patrons, trois classes
--
--   1. 706188 Eyes of Eternity   Cultist       P1 cooldown   EffectAura_2 : 4 -> 107
--   2. 504269 The Grim Reaper    Reaper        P6 critique   EffectAura_1 : 4 -> 108
--   3. 681493 Guardbreaker       Witch Hunter  P7 dégâts     EffectSpellClassMaskC_3 : 0 -> 33554432
--
--   Aucun des trois n'est touché par du C++ ni par une table : vérifié par `grep` sur
--   /opt/coa/core-main/modules/mod-ascension-compat/src et src/server (706188 n'apparaît
--   que dans un `HasAura` de AscensionCultistAbilities.cpp:219, qui concerne son autre
--   moitié ; 504269 n'apparaît que dans AscensionTalentReplacementData.h ; 681493
--   n'apparaît nulle part), et par `SELECT` sur spell_script_names, spell_proc et
--   spell_linked_spell : zéro ligne pour les trois.
--   Aucun des trois n'est déjà dans `spell_dbc` (119 lignes relevées, ids disjoints).
-- =====================================================================================


-- -------------------------------------------------------------------------------------
-- 1) 706188  « Eyes of Eternity »  —  Cultist, famille 31  —  P1 : cooldown
--
-- État lu dans Spell.dbc :
--   e1 : Effect=6 APPLY_AURA, EffectAura=4 SPELL_AURA_DUMMY, MiscValue=11,
--        BasePoints=-5001 (+DieSides 1 => montant -5000), masque (4,0,0)
--   e0 : Effect=3 DUMMY, aura 108, MiscValue=15  -> effet non porteur d'aura, inerte
--   e2 : Effect=6, aura 4, MiscValue=37          -> 37 hors de [0,32), sans emploi
--
-- Ce que dit la donnée : l'infobulle d'aura (champ 187) est
--   « Reduces the cooldown of Gaze of C'Thun by $/1000;s2 sec »
-- $s2 désigne l'effet 2, c'est-à-dire l'indice 1 : exactement l'effet ci-dessus.
-- MiscValue 11 est SPELLMOD_COOLDOWN (SpellDefines.h:71). -5000 / 1000 = -5 s.
-- Promesse écrite, opérande écrit, valeur écrite, masque écrit : il ne manque que
-- l'aura. Une aura 4 DUMMY ne crée aucun SpellModifier — AuraEffect::CalculateSpellMod
-- (SpellAuraEffects.cpp:768) ne s'exécute que pour 107 et 108.
-- FLAT et non PCT : la valeur est en millisecondes, et l'infobulle la divise par 1000.
--
-- CONFRONTATION DU MASQUE (4,0,0) À LA FAMILLE 31 — 1212 sorts examinés, un seul bit :
--   w0 bit 2 (=4) : 13 sorts de la famille le portent
--       500110 Gaze of C'Thun        Rank 1      <- la cible annoncée
--       502135..502143 Gaze of C'Thun Rank 2..10 <- ses neuf autres rangs
--       500640 Gaze of N'Zoth        Rank 1      <- SPILLOVER
--       500641 Gaze of Y'shaarj      Rank 1      <- SPILLOVER
--       500642 Gaze of Yogg-Saron    Rank 1      <- SPILLOVER
--   Les dix rangs de Gaze of C'Thun sont voulus. Les trois autres « Gaze » ne le sont
--   pas : l'infobulle ne nomme que C'Thun. Aucun bit plus fin n'existe — les quatre
--   sorts portent exactement le même SpellFamilyFlags (4,0,0). La donnée ne sait donc
--   PAS les séparer : soit on accepte que les trois autres Gaze voient aussi leur
--   cooldown baisser de 5 s, soit il faut du C++. Le prototype accepte le débordement
--   et le déclare ; c'est au concepteur de trancher avant d'appliquer.
-- -------------------------------------------------------------------------------------
