-- 3) 681493  « Guardbreaker »  —  Witch Hunter, famille 21  —  P7 : dégâts
--
-- CE PROTOTYPE NE RÉPARE PAS UN SILENCE : IL ÉTEINT UN INCENDIE.
--
-- État lu dans Spell.dbc :
--   e0 : Effect=6, aura 107, MiscValue=17 SPELLMOD_JUMP_TARGETS, montant 3,
--        masque (0, 0, 33554432)
--   e1 : Effect=6, aura 42 PROC_TRIGGER_SPELL -> EffectTriggerSpell_2 = 582588
--        « Pommel Smash » rank « Aura » (aura 87 MOD_DAMAGE_TAKEN MiscValue 126, +
--        aura 271). Ce proc est inerte, mais pour une autre raison : ProcFlags DBC
--        (champ 34) = 0 et aucune ligne `spell_proc` — P-045. Le patron n'y touche pas.
--        (Une première rédaction de ce commentaire disait « sans sort déclenché » :
--         c'était faux, et la valeur 582588 figure dans l'INSERT ci-dessous.)
--   e2 : Effect=6, aura 108 ADD_PCT_MODIFIER, MiscValue=0 SPELLMOD_DAMAGE,
--        BasePoints=49 (+1 => +50 %), masque (0, 0, 0)   <-- VIDE
--
-- L'infobulle dit « Increases the damage of Pommel Smash by $s3% and it now strikes
-- 2 additional nearby enemies ». Les deux moitiés sont dans le DBC, mais seule la
-- première porte son masque. La seconde, avec un masque vide et une famille non nulle,
-- tombe dans la première branche de IsAffected et rend true pour TOUT : aujourd'hui,
-- ce talent donne +50 % de dégâts à l'intégralité des sorts de famille 21 du
-- Witch Hunter, pas au seul Pommel Smash.
--
-- Le masque juste n'est pas à deviner. Deux écritures le donnent, et la seconde est la
-- plus forte :
--   (a) il est écrit six champs plus haut, sur l'effet 1 du MÊME sort, qui vise la même
--       capacité ;
--   (b) LE RANG 1 DE CE TALENT EST SAIN. 681097 « Guardbreaker » Rank 1, même famille 21 :
--         e1 = aura 107, MiscValue 17 JUMP_TARGETS, montant 2, masque (0,0,33554432)
--         e2 = aura 108 ADD_PCT_MODIFIER, MiscValue 0 SPELLMOD_DAMAGE, montant 25,
--              masque (0,0,33554432)   <-- exactement ce que le rang 2 a perdu
--       Le rang 2 n'a donc pas « oublié » un masque à l'origine : il l'a PERDU. C'est une
--       régression de saisie amont, reproductible — comparer systématiquement les rangs
--       d'un même talent est un contrôle qui vaut d'être fait ailleurs.
--
-- CONFRONTATION DU MASQUE (0,0,33554432) À LA FAMILLE 21 — 1108 sorts, un seul bit :
--   w2 bit 25 (=33554432) : 1 sort
--       680515 Pommel Smash, Rank 1  -> la cible annoncée, et elle seule.
--   Contrôle du nom : deux sorts s'appellent « Pommel Smash » dans tout le DBC —
--   680515 (Rank 1, flags (0,0,33554432)) et 582588 (rank « Aura », flags (0,0,524288)).
--   Le second est l'aura de marquage, pas la capacité ; il ne porte pas ce bit et n'est
--   donc pas touché. Aucun rang 2+ n'existe. Aucun débordement.
--
-- Ce que ce prototype NE fait pas : rien ici ne juge l'effet 1 (JUMP_TARGETS = 3 alors
-- que l'infobulle promet « 2 additional »). Ce n'est pas l'objet du patron.
-- -------------------------------------------------------------------------------------
