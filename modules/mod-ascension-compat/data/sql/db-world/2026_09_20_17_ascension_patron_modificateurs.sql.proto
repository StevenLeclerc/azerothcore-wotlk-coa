-- 2) 504269  « The Grim Reaper »  —  Reaper, famille 36  —  P6 : dégâts de critique
--
-- État lu dans Spell.dbc :
--   e0 : Effect=6 APPLY_AURA, EffectAura=4 SPELL_AURA_DUMMY, MiscValue=15,
--        BasePoints=14 (+1 => montant 15), masque (32768, 33554432, 0)
--   e1, e2 : vides.
--
-- Ce que dit la donnée : l'infobulle d'aura est
--   « Increases the critical damage of Slaughter by ${$w1}% »
-- $w1 = la valeur de l'effet 1 = 15. MiscValue 15 est SPELLMOD_CRIT_DAMAGE_BONUS.
-- PCT et non FLAT : l'infobulle écrit un pourcentage, et 15 points plats de bonus de
-- dégâts critiques n'aurait aucun sens sur cet opérande.
--
-- CONFRONTATION DU MASQUE (32768, 33554432, 0) À LA FAMILLE 36 — 1018 sorts, deux bits :
--   w1 bit 25 (=33554432) : 7 sorts
--       500373 Slaughter Rank 1  +  500429..500434 Slaughter Rank 2..7
--       -> exactement la cible annoncée, ses sept rangs, rien d'autre. Bit RETENU.
--   w0 bit 15 (=32768)    : 1 sort
--       520533 Painbringer, rank « Trigger1 », Effect[0] = 178
--       -> l'effet 178 est branché sur &Spell::EffectNULL dans SpellEffects.cpp:250
--          (« unknown Ascension effect ») : ce sort n'exécute rien, il n'inflige aucun
--          dégât, et un modificateur de dégâts critiques posé sur lui est sans portée.
--          Le bit est donc conservé tel qu'il est écrit dans le DBC — le débordement
--          est prouvé inoffensif.
--
--   LE JUMEAU 504028 TRANCHE LES DEUX QUESTIONS — lu après coup, relecture adverse.
--   Il existe un second sort « The Grim Reaper », 504028, rank vide, MÊME famille 36,
--   MÊME infobulle (« Increases the critical damage of Slaughter by $s1% »), déjà encodé :
--       e1 = Effect 6 APPLY_AURA, aura 107 ADD_FLAT_MODIFIER, MiscValue 15,
--            BasePoints 19 / DieSides 1 => montant 20, masque (0, 33554432, 0).
--   Deux enseignements, et un piège :
--     * son masque OMET w0.b15 : confronté à la famille 36 il rend Slaughter x7 et rien
--       d'autre. C'est la seule écriture disponible sur le sort de ce bit, et elle dit
--       de le retirer. Le retirer (MaskA_1 = 0) est donc mieux étayé que le conserver.
--     * son aura est FLAT, pas PCT — et c'est 504028 qui a tort, pas ce prototype :
--       Unit.cpp:9885 applique SPELLMOD_CRIT_DAMAGE_BONUS à `crit_bonus`, un MONTANT de
--       dégâts ; un +20 plat n'a aucun sens pour une infobulle écrite en %.
--     * 504028 est ABSENT de la population des 3 928 sorts de talent (sonde-talents/
--       final.json, vérifié) : ce n'est pas un talent appris, il n'y a donc pas de
--       double comptage avec 504269. C'est un doublon amont, pas une lecture à suivre.
-- -------------------------------------------------------------------------------------
