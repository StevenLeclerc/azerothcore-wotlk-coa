-- APRÈS APPLICATION — ce qu'il faudra vérifier, et dans cet ordre
--
--   1. La table n'est lue qu'au démarrage : redémarrer `coa-world-bots`. Un `.reload`
--      ne sert à rien ici.
--   2. Au démarrage, contrôler Errors.log : une ligne `spell_dbc` mal formée ne se
--      signale pas par un avertissement mais par un ASSERT, donc par un arrêt.
--   3. En jeu, avec un personnage de la classe concernée, comparer le cooldown affiché
--      de Gaze of C'Thun avant/après, et les dégâts critiques de Slaughter. Les bots
--      ne suffisent pas : leur IA n'utilise pas ces capacités.
--   4. Pour 681493, la vérification qui compte est la NON-régression : mesurer que les
--      autres sorts du Witch Hunter perdent les +50 % qu'ils n'auraient jamais dû avoir.
